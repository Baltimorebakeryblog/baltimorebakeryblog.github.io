<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — baltimorebakeryblog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>%F0%9F%A5%90</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
<a href="#content" class="skip-link">Skip to content</a>
<div class="wrap-wide">

  <header class="site-header" id="site-header"></header>

  <main id="content">
    <h1 class="page-title">Map</h1>
    <p class="page-sub">Every bakery I've got coordinates for — visited and backlog alike.</p>

    <div id="map"></div>
    <div class="map-legend">
      <span class="visited">Visited</span>
      <span class="backlog">Backlog</span>
    </div>
    <p id="no-coords" class="empty-state" style="margin-top:1.5rem;"></p>
  </main>

  <footer id="site-footer"></footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="partials.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const withCoords = BAKERIES.filter(b => typeof b.lat === "number" && typeof b.lng === "number");
  const withoutCoords = BAKERIES.length - withCoords.length;

  const map = L.map("map").setView([39.0, -76.7], 8); // roughly centered on Maryland

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  function pinIcon(color, visited) {
    const shape = visited ? "border-radius:50%;" : "border-radius:3px;transform:rotate(45deg);";
    return L.divIcon({
      className: "",
      html: `<div style="width:16px;height:16px;${shape}background:${color};border:2px solid #fffaf1;box-shadow:0 0 0 1px rgba(0,0,0,0.25);"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
  }

  // Pins outside Maryland (e.g. travel stops) would otherwise force the
  // default view to zoom way out to fit them. So the initial view fits
  // only the Maryland cluster; every pin still gets placed on the map,
  // and out-of-state ones are just a scroll/zoom away.
  const mdBounds = [];
  const allBounds = [];
  let outOfStateCount = 0;

  withCoords.forEach(b => {
    const color = b.visited ? "#b5533c" : "#8a9a7a";
    const marker = L.marker([b.lat, b.lng], { icon: pinIcon(color, b.visited) }).addTo(map);
    const scoreLine = b.visited ? `Score: ${formatScore(b.score)}` : "Not visited yet";
    const link = b.visited ? `<br><a href="${reviewLink(b)}">Read review &rarr;</a>` : "";
    marker.bindPopup(`<strong>${b.name}</strong><br>${b.city}<br>${scoreLine}${link}`);

    const isMaryland = /,\s*MD$/i.test((b.city || "").trim());
    allBounds.push([b.lat, b.lng]);
    if (isMaryland) {
      mdBounds.push([b.lat, b.lng]);
    } else {
      outOfStateCount++;
    }
  });

  const boundsToFit = mdBounds.length ? mdBounds : allBounds;
  if (boundsToFit.length) {
    map.fitBounds(boundsToFit, { padding: [30, 30], maxZoom: 11 });
  }

  const noCoordsEl = document.getElementById("no-coords");
  const notes = [];
  if (outOfStateCount > 0) {
    notes.push(
      `${outOfStateCount} ${outOfStateCount === 1 ? "bakery is" : "bakeries are"} outside Maryland (travel stops), so the map opens zoomed to the Maryland cluster — zoom or scroll out to find ${outOfStateCount === 1 ? "it" : "them"}.`
    );
  }
  if (withoutCoords > 0) {
    notes.push(
      `${withoutCoords} ${withoutCoords === 1 ? "bakery doesn't" : "bakeries don't"} have coordinates yet, so ${withoutCoords === 1 ? "it isn't" : "they aren't"} pinned above. Add lat/lng in data.js to place them.`
    );
  }
  noCoordsEl.textContent = notes.join(" ");
</script>
</body>
</html>
