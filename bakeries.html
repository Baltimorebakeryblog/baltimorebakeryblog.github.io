<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Bakeries — The Old Line Bakery Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap-wide">

  <header class="site-header">
    <h1 class="site-title"><a href="index.html">The Old Line Bakery Trail</a></h1>
    <p class="tagline">One Maryland bakery at a time.</p>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="bakeries.html" class="active">All Bakeries</a>
      <a href="rankings.html">Rankings</a>
      <a href="map.html">Map</a>
      <a href="to-visit.html">Bakeries to Visit</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">All Bakeries</h1>
    <p class="page-sub">Every bakery I've visited, A to Z.</p>

    <table class="bakery-list">
      <thead>
        <tr>
          <th>Name</th>
          <th>Score</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody id="bakery-rows"></tbody>
    </table>
  </main>

  <footer>
    &copy; 2026 The Old Line Bakery Trail. Built with care in Maryland.
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const rows = byName(visitedBakeries());
  const tbody = document.getElementById("bakery-rows");

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No visited bakeries yet — flip <code>visited</code> to true on an entry in data.js.</td></tr>';
  } else {
    tbody.innerHTML = rows.map(b => {
      const nameCell = b.review
        ? `<a href="${reviewLink(b)}">${b.name}</a>`
        : `<a href="${reviewLink(b)}">${b.name}</a> <span class="no-review">(notes only)</span>`;
      return `
        <tr>
          <td class="name">${nameCell}</td>
          <td class="score-cell">${scoreBadgeHtml(b.score, true)}</td>
          <td>${b.city}</td>
        </tr>`;
    }).join("");
  }
</script>
</body>
</html>
