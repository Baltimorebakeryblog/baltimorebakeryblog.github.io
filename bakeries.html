<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Bakeries — baltimorebakeryblog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>%F0%9F%A5%90</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#content" class="skip-link">Skip to content</a>
<div class="wrap-wide">

  <header class="site-header" id="site-header"></header>

  <main id="content">
    <h1 class="page-title">All Bakeries</h1>
    <p class="page-sub">Every bakery I've visited, A to Z.</p>

    <div class="table-card">
      <table class="bakery-list">
        <thead>
          <tr>
            <th>Name</th>
            <th>Score</th>
            <th>City</th>
          </tr>
        </thead>
        <tbody id="bakery-rows"></tbody>
      </table>
    </div>
  </main>

  <footer id="site-footer"></footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="partials.js"></script>
<script>
  const rows = byName(visitedBakeries());
  const tbody = document.getElementById("bakery-rows");

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No visited bakeries yet — flip <code>visited</code> to true on an entry in data.js.</td></tr>';
  } else {
    tbody.innerHTML = rows.map(b => {
      const nameCell = b.review
        ? `<a href="${reviewLink(b)}">${b.name}</a>`
        : `<a href="${reviewLink(b)}">${b.name}</a> <span class="no-review">(notes only)</span>`;
      return `
        <tr>
          <td class="name">${nameCell}</td>
          <td class="score-cell">${scoreBadgeHtml(b.score, true)}</td>
          <td>${b.city}</td>
        </tr>`;
    }).join("");
  }
</script>
</body>
</html>
