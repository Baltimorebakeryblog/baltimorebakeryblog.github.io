<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakeries to Visit — baltimorebakeryblog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>%F0%9F%A5%90</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#content" class="skip-link">Skip to content</a>
<div class="wrap">

  <header class="site-header" id="site-header"></header>

  <main id="content">
    <h1 class="page-title">Bakeries to Visit</h1>
    <p class="page-sub">The backlog. No score, no review — just a reminder to go.</p>

    <ul class="to-visit-list" id="to-visit"></ul>
  </main>

  <footer id="site-footer"></footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="partials.js"></script>
<script>
  const list = toVisitList();
  const container = document.getElementById("to-visit");
  container.innerHTML = list.length
    ? list.map(b => `
        <li>
          <div class="tv-name">${b.name}</div>
          <div class="tv-city">${b.city}</div>
          ${b.notes ? `<div class="tv-note">${b.notes}</div>` : ""}
        </li>`).join("")
    : '<li class="empty-state">The backlog is empty — add an entry with <code>visited: false</code> in data.js.</li>';
</script>
</body>
</html>
