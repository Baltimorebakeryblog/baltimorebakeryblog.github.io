<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review — The Old Line Bakery Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1 class="site-title"><a href="index.html">The Old Line Bakery Trail</a></h1>
    <p class="tagline">One Maryland bakery at a time.</p>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="bakeries.html">All Bakeries</a>
      <a href="rankings.html">Rankings</a>
      <a href="map.html">Map</a>
      <a href="to-visit.html">Bakeries to Visit</a>
    </nav>
  </header>

  <main id="content">
    <!-- filled in by script -->
  </main>

  <footer>
    &copy; 2026 The Old Line Bakery Trail. Built with care in Maryland.
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("id");
  const bakery = slug ? findBySlug(slug) : null;
  const content = document.getElementById("content");

  if (!bakery) {
    content.innerHTML = `
      <h1 class="page-title">Bakery not found</h1>
      <p class="page-sub">That link doesn't match anything in the list yet.</p>
      <a class="back-link" href="bakeries.html">&larr; Back to All Bakeries</a>`;
  } else {
    document.title = bakery.name + " — The Old Line Bakery Trail";

    const meta = [
      bakery.city,
      bakery.dateVisited ? "Visited " + formatDate(bakery.dateVisited) : null,
      bakery.superlative
    ].filter(Boolean).join(" &middot; ");

    let bodyHtml;
    if (bakery.review) {
      bodyHtml = bakery.review
        .split("\n\n")
        .map(p => `<p>${p}</p>`)
        .join("");
    } else {
      bodyHtml = `<p class="empty-state">Full review coming soon. In the meantime: ${bakery.notes || "no notes yet."}</p>`;
    }

    content.innerHTML = `
      <div class="review-header">
        ${scoreBadgeHtml(bakery.score)}
        <h1 class="page-title" style="display:inline-block;margin-left:0.75rem;vertical-align:middle;">${bakery.name}</h1>
        <div class="review-meta">${meta}</div>
      </div>
      <div class="review-body">${bodyHtml}</div>
      <a class="back-link" href="bakeries.html">&larr; Back to All Bakeries</a>`;
  }
</script>
</body>
</html>
