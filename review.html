<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review — baltimorebakeryblog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>%F0%9F%A5%90</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#content" class="skip-link">Skip to content</a>
<div class="wrap">

  <header class="site-header" id="site-header"></header>

  <main id="content">
    <!-- filled in by script -->
  </main>

  <footer id="site-footer"></footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="partials.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("id");
  const bakery = slug ? findBySlug(slug) : null;
  const content = document.getElementById("content");

  if (!bakery) {
    content.innerHTML = `
      <h1 class="page-title">Bakery not found</h1>
      <p class="page-sub">That link doesn't match anything in the list yet.</p>
      <a class="back-link" href="bakeries.html">&larr; Back to All Bakeries</a>`;
  } else {
    document.title = bakery.name + " — baltimorebakeryblog";

    const meta = [
      bakery.city,
      bakery.dateVisited ? "Visited " + formatDate(bakery.dateVisited) : null,
      bakery.superlative
    ].filter(Boolean).join(" &middot; ");

    let bodyHtml;
    if (bakery.review) {
      bodyHtml = bakery.review
        .split("\n\n")
        .map(p => `<p>${p}</p>`)
        .join("");
    } else {
      bodyHtml = `<p class="empty-state">Full review coming soon. In the meantime: ${bakery.notes || "no notes yet."}</p>`;
    }

    content.innerHTML = `
      <div class="review-header">
        ${scoreBadgeHtml(bakery.score)}
        <h1 class="page-title" style="display:inline-block;margin-left:0.75rem;vertical-align:middle;">${bakery.name}</h1>
        <div class="review-meta">${meta}</div>
      </div>
      <div class="review-body">${bodyHtml}</div>
      <a class="back-link" href="bakeries.html">&larr; Back to All Bakeries</a>`;
  }
</script>
</body>
</html>
