<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rankings — The Old Line Bakery Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1 class="site-title"><a href="index.html">The Old Line Bakery Trail</a></h1>
    <p class="tagline">One Maryland bakery at a time.</p>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="bakeries.html">All Bakeries</a>
      <a href="rankings.html" class="active">Rankings</a>
      <a href="map.html">Map</a>
      <a href="to-visit.html">Bakeries to Visit</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Rankings</h1>
    <p class="page-sub">The current standings — updated as I visit more places.</p>

    <section class="block">
      <h2 class="block-title">Top 10</h2>
      <ol class="top10" id="top10"></ol>
    </section>

    <section class="block">
      <h2 class="block-title">Best of Category</h2>
      <div class="super-grid" id="superlatives"></div>
    </section>
  </main>

  <footer>
    &copy; 2026 The Old Line Bakery Trail. Built with care in Maryland.
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const top10El = document.getElementById("top10");
  const top10 = topScored(10);
  top10El.innerHTML = top10.length
    ? top10.map(b => `
        <li>
          ${scoreBadgeHtml(b.score)}
          <div class="entry-body">
            <div class="entry-title"><a href="${reviewLink(b)}">${b.name}</a></div>
            <div class="entry-meta">${b.city}</div>
          </div>
        </li>`).join("")
    : '<li class="empty-state">No scored bakeries yet.</li>';

  const superEl = document.getElementById("superlatives");
  const supers = superlatives();
  superEl.innerHTML = supers.length
    ? supers.map(b => `
        <div class="super-card">
          <div class="super-label">${b.superlative}</div>
          <div class="super-name"><a href="${reviewLink(b)}">${b.name}</a></div>
          <div class="entry-meta">${b.city} &middot; ${scoreBadgeHtml(b.score, true)}</div>
        </div>`).join("")
    : '<p class="empty-state">Set a <code>superlative</code> on a bakery in data.js (e.g. "Best Croissant") to feature it here.</p>';
</script>
</body>
</html>
