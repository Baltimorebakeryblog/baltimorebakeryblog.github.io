<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Old Line Bakery Trail</title>
<meta name="description" content="A running notebook of Maryland's best bakeries — reviews, rankings, a map, and the growing backlog.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1 class="site-title"><a href="index.html">The Old Line Bakery Trail</a></h1>
    <p class="tagline">One Maryland bakery at a time.</p>
    <nav class="site-nav">
      <a href="index.html" class="active">Home</a>
      <a href="bakeries.html">All Bakeries</a>
      <a href="rankings.html">Rankings</a>
      <a href="map.html">Map</a>
      <a href="to-visit.html">Bakeries to Visit</a>
    </nav>
  </header>

  <main>
    <section class="block">
      <h2 class="block-title">Newest Reviews</h2>
      <div id="newest"></div>
    </section>

    <section class="block">
      <h2 class="block-title">Current Favorites</h2>
      <div id="favorites"></div>
    </section>
  </main>

  <footer>
    &copy; 2026 The Old Line Bakery Trail. Built with care in Maryland.
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  function renderEntry(b) {
    const meta = [b.city, b.dateVisited ? formatDate(b.dateVisited) : null].filter(Boolean).join(" &middot; ");
    const excerpt = b.notes || (b.review ? b.review.split("\n\n")[0] : "No notes yet.");
    const favBadge = b.favorite ? '<span class="badge">Favorite</span>' : "";
    return `
      <div class="entry">
        ${scoreBadgeHtml(b.score)}
        <div class="entry-body">
          <div class="entry-title"><a href="${reviewLink(b)}">${b.name}</a>${favBadge}</div>
          <div class="entry-meta">${meta}</div>
          <p class="entry-excerpt">${excerpt}</p>
        </div>
      </div>`;
  }

  const newest = newestReviews(5);
  document.getElementById("newest").innerHTML = newest.length
    ? newest.map(renderEntry).join("")
    : '<p class="empty-state">No reviews yet — add a visited bakery to data.js to get started.</p>';

  const favs = favorites();
  document.getElementById("favorites").innerHTML = favs.length
    ? favs.map(renderEntry).join("")
    : '<p class="empty-state">Mark a bakery as <code>favorite: true</code> in data.js to feature it here.</p>';
</script>
</body>
</html>
